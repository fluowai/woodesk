    external: true
  woo-storage-network:
    external: true
  chatcode-internal:
    driver: overlay
    attachable: true

volumes:
  whatsapp_sessions:
    driver: local
  rabbitmq_data:
    driver: local
  chatcode_traefik_dynamic:
    driver: local
