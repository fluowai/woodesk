  VITE_MINIO_PUBLIC_URL: "https://storage.wootech.com.br"
  MINIO_ACCESS_KEY: "pH8gKEiDqbTuhO60FDjW"
  MINIO_SECRET_KEY: "ggONXEIGQDXmuedhockfijY4ORj8octbbrwGSDZi"
